<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/css/style.css">
    <title>ViewTransitions</title>
</head>

<body>
    <section class="container">
        <form id='category-form'>
            <label for='categories' class='visually-hidden'>Category</label>
            <select id='categories' name='categories'>
                <option value='all'>All</option>
                <option value='landscapes'>Landscapes</option>
                <option value='architecture'>Architecture</option>
                <option value='animals'>Animals</option>
            </select>
        </form>
        <div class="cards grid-auto-fill">
            <div id='card card-1' class="card" data-cat='animals'>
                <h3 class='card-title'>Turtle</h3>
                <img src="./src/images/animals-01.jpg" />
            </div>
            <div id='card card-2' class="card" data-cat='animals'>
                <h3 class='card-title'>Bear</h3>
                <img src="./src/images/animals-02.jpg" />
            </div>
            <div id='card card-3' class="card" data-cat='animals'>
                <h3 class='card-title'>Arctic Fox</h3>
                <img src="./src/images/animals-03.jpg" />
            </div>
            <div id='card card-4' class="card" data-cat='architecture'>
                <h3 class='card-title'>Building Abstract 1</h3>
                <img src="./src/images/architecture-01.jpg" />
            </div>
            <div id='card card-5' class="card" data-cat='architecture'>
                <h3 class='card-title'>Building Abstract 2</h3>
                <img src="./src/images/architecture-02.jpg" />
            </div>
            <div id='card card-6' class="card" data-cat='architecture'>
                <h3 class='card-title'>Building Abstract 3</h3>
                <img src="./src/images/architecture-03.jpg" />
            </div>
            <div id='card card-7' class="card" data-cat='architecture'>
                <h3 class='card-title'>Building Abstract 4</h3>
                <img src="./src/images/architecture-04.jpg" />
            </div>
            <div id='card card-8' class="card" data-cat='landscapes'>
                <h3 class='card-title'>Landscape 1</h3>
                <img src="./src/images/landscape-01.jpg" />
            </div>
            <div id='card card-9' class="card" data-cat='landscapes'>
                <h3 class='card-title'>Landscape 2</h3>
                <img src="./src/images/landscape-02.jpg" />
            </div>
            <div id='card card-10' class="card" data-cat='landscapes'>
                <h3 class='card-title'>Landscape 3</h3>
                <img src="./src/images/landscape-03.jpg" />
            </div>
            <div id='card card-11' class="card" data-cat='architecture'>
                <h3 class='card-title'>Building Abstract 5</h3>
                <img src="./src/images/landscape-04.jpg" />
            </div>
        </div>
    </section>

    <script type="module" src="./src/js/script.js"></script>
</body>

</html>
